<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#0f1724}.app{fill:#f4f7fb}.surface{fill:#fff;stroke:#dfe7f1;stroke-width:1}
      .soft{fill:#f7f9fc;stroke:#e3eaf4;stroke-width:1}.blue{fill:#1677ff}.blueSoft{fill:#edf5ff}
      .green{fill:#13a36d}.greenSoft{fill:#eaf9f2}.red{fill:#ef4d55}.redSoft{fill:#fff0f1}
      .amber{fill:#f3a516}.amberSoft{fill:#fff6df}.ink{fill:#13233d}.muted{fill:#7f8ea5}
      .code{fill:#101827;stroke:#1b2940}.code2{fill:#121c2b;stroke:#1b2940}
      .t{font:600 15px system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .s{font:500 11px system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .xs{font:500 9px system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font:500 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .white{fill:#fff}.line{stroke:#dfe7f1;stroke-width:1}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="32" y="30" class="s white">Codex Header Rewrite · Approved UI Baseline</text>

  <!-- Desktop -->
  <rect x="20" y="45" width="1200" height="810" rx="12" class="app"/>
  <rect x="20" y="45" width="1200" height="58" rx="12" class="surface"/>
  <rect x="38" y="57" width="34" height="34" rx="9" class="blue"/>
  <text x="49" y="80" class="t white">C</text>
  <text x="84" y="71" class="t ink">Codex Header Rewrite</text>
  <text x="84" y="87" class="xs muted">Rewrite headers for Codex. More control. More possibilities.</text>

  <rect x="542" y="56" width="250" height="36" rx="7" fill="#fff" stroke="#9fc5ff"/>
  <text x="555" y="69" class="xs muted">当前凭证</text>
  <circle cx="623" cy="75" r="4" class="green"/>
  <text x="635" y="80" class="s ink">sk-…a1b2（默认）</text>
  <text x="776" y="80" class="s muted">⌄</text>
  <rect x="800" y="59" width="64" height="30" rx="7" class="greenSoft"/>
  <circle cx="812" cy="74" r="4" class="green"/>
  <text x="820" y="78" class="xs green">已连接</text>
  <text x="881" y="78" class="xs muted">v0.3.0</text>
  <rect x="931" y="58" width="88" height="31" rx="7" class="surface"/><text x="950" y="78" class="xs ink">管理密钥</text>
  <rect x="1028" y="58" width="92" height="31" rx="7" class="redSoft"/><text x="1047" y="78" class="xs red">清理遗留</text>

  <rect x="20" y="103" width="1200" height="40" fill="#fff" stroke="#e3eaf4"/>
  <text x="40" y="128" class="s blue">Header 规则</text>
  <text x="148" y="128" class="s ink">测试请求</text>
  <text x="242" y="128" class="s ink">请求历史</text>
  <text x="338" y="128" class="s ink">State 池</text>
  <text x="414" y="128" class="s ink">Turn-State 解码</text>
  <rect x="37" y="139" width="72" height="2" class="blue"/>

  <!-- Main columns -->
  <rect x="36" y="157" width="568" height="472" rx="8" class="surface"/>
  <text x="52" y="181" class="t ink">Header 规则</text>
  <text x="52" y="198" class="xs muted">配置请求头的设置、覆盖、移除规则，右侧实时预览最终效果</text>
  <rect x="498" y="169" width="40" height="20" rx="10" class="blue"/><circle cx="528" cy="179" r="8" fill="#fff"/>
  <text x="545" y="183" class="xs ink">启用改写</text>

  <!-- Set block -->
  <rect x="51" y="214" width="538" height="147" rx="7" class="soft"/>
  <rect x="62" y="226" width="24" height="24" rx="7" class="greenSoft"/><text x="70" y="243" class="s green">+</text>
  <text x="94" y="239" class="s ink">设置 / 覆盖 Header</text>
  <text x="94" y="253" class="xs muted">添加或覆盖请求头，会覆盖原始值</text>
  <rect x="217" y="227" width="22" height="18" rx="9" class="greenSoft"/><text x="225" y="240" class="xs green">3</text>
  <rect x="62" y="266" width="516" height="23" rx="5" fill="#f5f8fc"/>
  <text x="72" y="281" class="xs muted">Header 名称</text><text x="250" y="281" class="xs muted">值</text><text x="430" y="281" class="xs muted">说明</text>
  <text x="72" y="305" class="mono ink">user-agent</text><text x="250" y="305" class="mono ink">Mozilla/5.0 …</text><text x="430" y="305" class="xs muted">自定义 UA</text>
  <line x1="62" y1="314" x2="578" y2="314" class="line"/>
  <text x="72" y="330" class="mono ink">x-foo</text><text x="250" y="330" class="mono ink">bar</text><text x="430" y="330" class="xs muted">测试值</text>
  <rect x="62" y="335" width="104" height="20" rx="5" class="blue"/><text x="76" y="349" class="xs white">＋ 添加 Header</text>

  <!-- Remove block -->
  <rect x="51" y="370" width="538" height="104" rx="7" class="soft"/>
  <rect x="62" y="382" width="24" height="24" rx="7" class="redSoft"/><text x="70" y="399" class="s red">×</text>
  <text x="94" y="395" class="s ink">移除 Header</text><text x="94" y="409" class="xs muted">从请求中移除指定的请求头</text>
  <rect x="198" y="383" width="22" height="18" rx="9" class="redSoft"/><text x="206" y="396" class="xs red">2</text>
  <text x="72" y="438" class="mono ink">x-openai-assistant-app-id</text><text x="390" y="438" class="xs muted">移除官方标识</text>
  <text x="72" y="459" class="mono ink">x-stainless-retry-count</text><text x="390" y="459" class="xs muted">避免重试干扰</text>

