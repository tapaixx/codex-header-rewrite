  <text x="646" y="328" class="mono" fill="#d8e3f0">3    "accept-language": "en-US,…",</text><text x="646" y="346" class="mono" fill="#ff9da3">4    "x-stainless-retry-count": "0",</text>
  <text x="646" y="364" class="mono" fill="#ff9da3">5    "x-codex-turn-state": "invalid",</text><text x="646" y="382" class="mono" fill="#d8e3f0">6    "connection": "keep-alive"</text>
  <text x="646" y="400" class="mono" fill="#d8e3f0">7  }</text>
  <text x="916" y="292" class="mono" fill="#d8e3f0">1  {</text><text x="916" y="310" class="mono" fill="#53e1af">2    "user-agent": "Mozilla/5.0 …",</text>
