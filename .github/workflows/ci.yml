name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go test -tags localtest -modfile=go.localtest.mod ./...
      - run: go vet ./...
      - run: go vet -tags localtest -modfile=go.localtest.mod ./...
      - run: CGO_ENABLED=1 go build -buildmode=c-shared -o /tmp/codex-header-rewrite.so .

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - name: Install arm64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: go mod download
      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -buildmode=c-shared -o dist/codex-header-rewrite-linux-${GOARCH}.so .
          rm -f dist/*.h
      - uses: actions/upload-artifact@v4
        with:
          name: codex-header-rewrite-linux-${{ matrix.arch }}
          path: dist/*.so
