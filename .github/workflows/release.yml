name: Release

# Tag pushes still publish exactly as before. In addition, a main-branch
# commit named "release: vX.Y.Z" is published only after the CI workflow for
# that exact commit succeeds. This keeps releases gated by CI without needing
# a long-lived release branch.
on:
  push:
    tags:
      - v*
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       startsWith(github.event.workflow_run.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_DIR: ${{ github.workspace }}/.release
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false

      - name: Resolve semantic version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            subject="$(git log -1 --pretty=%s)"
            case "$subject" in
              "release: v"*) tag="${subject#release: }" ;;
              *) printf 'workflow_run release requires commit subject: release: vX.Y.Z\n' >&2; exit 1 ;;
            esac
          fi
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?
      - name: Install release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross unzip zip

      - name: Resolve module dependencies
        run: go mod tidy

      - name: Prepare release directory
        run: mkdir -p "$RELEASE_DIR"

      - name: Build Linux amd64 plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.pluginVersion=${VERSION}" -buildmode=c-shared -o "$RELEASE_DIR/codex-header-rewrite-linux-amd64.so" .

      - name: Build Linux arm64 plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.pluginVersion=${VERSION}" -buildmode=c-shared -o "$RELEASE_DIR/codex-header-rewrite-linux-arm64.so" .

      - name: Discard generated C headers
        run: rm -f "$RELEASE_DIR"/*.h

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh "$VERSION" "$RELEASE_DIR"

      - name: Smoke-test release layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package_release_test.sh "$RELEASE_DIR" "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.target }}
          name: Codex Header Rewrite ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/.release/codex-header-rewrite_${{ steps.version.outputs.version }}_linux_amd64.zip
            ${{ github.workspace }}/.release/codex-header-rewrite_${{ steps.version.outputs.version }}_linux_arm64.zip
            ${{ github.workspace }}/.release/checksums.txt
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-amd64.so
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-arm64.so
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-amd64.so.sha256
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-arm64.so.sha256
; then
            printf 'invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross unzip zip

      - name: Resolve module dependencies
        run: go mod tidy

      - name: Prepare release directory
        run: mkdir -p "$RELEASE_DIR"

      - name: Build Linux amd64 plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.pluginVersion=${VERSION}" -buildmode=c-shared -o "$RELEASE_DIR/codex-header-rewrite-linux-amd64.so" .

      - name: Build Linux arm64 plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.pluginVersion=${VERSION}" -buildmode=c-shared -o "$RELEASE_DIR/codex-header-rewrite-linux-arm64.so" .

      - name: Discard generated C headers
        run: rm -f "$RELEASE_DIR"/*.h

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh "$VERSION" "$RELEASE_DIR"

      - name: Smoke-test release layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package_release_test.sh "$RELEASE_DIR" "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Codex Header Rewrite ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/.release/codex-header-rewrite_${{ steps.version.outputs.version }}_linux_amd64.zip
            ${{ github.workspace }}/.release/codex-header-rewrite_${{ steps.version.outputs.version }}_linux_arm64.zip
            ${{ github.workspace }}/.release/checksums.txt
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-amd64.so
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-arm64.so
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-amd64.so.sha256
            ${{ github.workspace }}/.release/codex-header-rewrite-linux-arm64.so.sha256
