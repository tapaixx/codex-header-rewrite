name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - name: Install arm64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: go mod download
      - run: go test ./...
      - run: go test -tags localtest -modfile=go.localtest.mod ./...
      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -buildmode=c-shared -o dist/codex-header-rewrite-linux-${GOARCH}.so .
          rm -f dist/*.h
          cd dist
          sha256sum *.so > SHA256SUMS-${GOARCH}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: cat dist/SHA256SUMS-* > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.so dist/SHA256SUMS --generate-notes --title "${GITHUB_REF_NAME}"
